name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      r2:
        description: Use existing writer credentials for trusted isolated R2 validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
      checker-reports: ${{ steps.scope.outputs.checker-reports }}
      lint-base: ${{ github.event_name == 'pull_request' && steps.scope.outputs.sha || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve validation scope
        id: scope
        uses: ./.github/actions/resolve-hygiene-base

  repository:
    name: Repository / check
    needs: changes
    if: ${{ needs.changes.outputs.docs-only == 'true' || needs.changes.outputs.docs-only == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read documentation Python version
        if: ${{ needs.changes.outputs.docs-only == 'true' }}
        id: python-version
        run: |
          python3 -c 'import json; print("version=" + json.load(open("script/ao/toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - name: Set up documentation Python
        if: ${{ needs.changes.outputs.docs-only == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python-version.outputs.version }}
      - name: Cache pinned documentation formatter
        if: ${{ needs.changes.outputs.docs-only == 'true' }}
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/aobus-doc-tools/tools/prettier
          key: docs-prettier-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/ao/prettier.json', 'script/ao/portal/prettier.py') }}
      - name: Check documentation
        if: ${{ needs.changes.outputs.docs-only == 'true' }}
        env:
          AOBUS_STATE_ROOT: ${{ runner.temp }}/aobus-doc-tools
          PYTHONPATH: script
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --only-binary=:all: --require-hashes --no-deps -r script/ao/docs-requirements.txt
          python -m ao setup prettier
          python -m ao check docs
          python -m ao check format --docs

      - name: Install Nix
        if: ${{ needs.changes.outputs.docs-only == 'false' }}
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          enable_kvm: false
      - name: Check repository
        if: ${{ needs.changes.outputs.docs-only == 'false' }}
        env:
          AOBUS_STATE_ROOT: ${{ runner.temp }}/aobus-state
        run: ./ao check repository --path "$RUNNER_TEMP/aobus-bazel-repository"
      - name: Preserve repository check evidence
        if: ${{ !cancelled() && needs.changes.outputs.docs-only == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-repository-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aobus-bazel-repository/checks/fastbuild/repository-*
            ${{ runner.temp }}/aobus-bazel-repository/state/output/execroot/_main/bazel-out/*/testlogs/**
          if-no-files-found: warn

  linux:
    name: Linux / native
    needs: changes
    if: ${{ needs.changes.outputs.docs-only == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use every runner core
        shell: bash
        run: >-
          python3 script/ao/core/jobs.py export-ci
          --github-env "$GITHUB_ENV"

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          enable_kvm: false

      - name: Select runner-local state
        shell: bash
        run: |
          echo "AOBUS_STATE_ROOT=$RUNNER_TEMP/aobus-state" >> "$GITHUB_ENV"
          echo "AOBUS_BAZEL_DISK_CACHE=$RUNNER_TEMP/aobus-state/cache/bazel" >> "$GITHUB_ENV"

      - name: Provision Bazel tree
        run: ./ao setup bazel

      - name: Show initial disk usage
        run: df -h

      # Persist only content-addressed disk actions, never workspace/server,
      # repository, provider or Nix state. The pin-contract prefix selects
      # candidates; Bazel action keys still decide reuse. PRs may restore main's
      # cache but must never promote writes into the trusted main archive pool.
      - name: Restore Bazel disk cache
        id: bazel-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.AOBUS_BAZEL_DISK_CACHE }}/ac
            ${{ env.AOBUS_BAZEL_DISK_CACHE }}/cas
          key: >-
            bazel-disk-v2-trusted-main-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('.bazelversion', 'script/ao/bazel-toolchain.json', 'nixpkgs.json', 'shell.nix', 'MODULE.bazel')
            }}-${{ github.sha }}
          restore-keys: >-
            bazel-disk-v2-trusted-main-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('.bazelversion', 'script/ao/bazel-toolchain.json', 'nixpkgs.json', 'shell.nix', 'MODULE.bazel')
            }}-

      # Mark restored entries after restore, outside the archived directory.
      - name: Mark restored Bazel disk cache
        id: bazel-cache-marker
        continue-on-error: true
        shell: bash
        env:
          AOBUS_BAZEL_CACHE_MARKER: ${{ runner.temp }}/aobus-bazel-cache-restored.marker
        run: touch "$AOBUS_BAZEL_CACHE_MARKER"

      # Same-repository PRs consume main's R2 cache without proxy uploaders;
      # fork PRs never receive these credentials. Main and manual runs retain
      # writer mode. Disabling uploaders is not backend authorization.
      - name: Start Bazel remote cache
        id: bazel-remote
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.r2) ||
              (vars.AOBUS_BAZEL_R2_CACHE_AUTHORIZED == 'true' &&
               ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) }}
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || !inputs.r2 }}
        shell: bash
        env:
          R2_ENDPOINT: ${{ secrets.R2_SCCACHE_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          CACHE_PREFIX: ${{ github.event_name == 'workflow_dispatch' && format('bazel-ci-validation/{0}/{1}/linux', github.run_id, github.run_attempt) || 'bazel-v1' }}
          CACHE_UPLOAD: ${{ github.event_name != 'pull_request' }}
        run: |
          # Expand variables inside the Nix child, not the runner's host shell.
          # shellcheck disable=SC2016
          script/ao/pinned-nix-shell.sh ./shell.nix --run 'python3 script/ao/portal/bazel_remote_cache.py start --state "$RUNNER_TEMP/aobus-bazel-remote" --github-output "$GITHUB_OUTPUT" --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" --trusted-writer "$CACHE_UPLOAD" --key-prefix "$CACHE_PREFIX"'

      - name: Require requested R2 cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.r2 }}
        env:
          CACHE_URL: ${{ steps.bazel-remote.outputs.url }}
        run: test -n "$CACHE_URL"

      - name: Check Bazel completion
        id: bazel-check
        shell: bash
        env:
          AOBUS_STATE_ROOT: ${{ runner.temp }}/aobus-state
          AOBUS_BAZEL_REMOTE_CACHE: ${{ steps.bazel-remote.outputs.url }}
          LINT_BASE_SHA: ${{ needs.changes.outputs.lint-base }}
        run: |
          lint_args=(--extend)
          if [[ -n "$LINT_BASE_SHA" ]]; then lint_args=(--lint-base "$LINT_BASE_SHA"); fi
          ./ao check --native-only --path "$RUNNER_TEMP/aobus-bazel-fastbuild" --jobs "$CMAKE_BUILD_PARALLEL_LEVEL" "${lint_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/aobus-completion.log"

      - name: Test native checker reports
        if: ${{ needs.changes.outputs.checker-reports == 'true' }}
        shell: bash
        env:
          AOBUS_BAZEL_REMOTE_CACHE: ${{ steps.bazel-remote.outputs.url }}
        run: |
          # Expand runner paths inside the pinned Python environment.
          # shellcheck disable=SC2016
          script/ao/pinned-nix-shell.sh ./shell.nix --run 'PYTHONPATH=script "$AO_NIX_PORTAL_PYTHON" -S -B -X utf8 test/lint/check_checker_reports.py "$RUNNER_TEMP/aobus-bazel-fastbuild"'

      # Drain acknowledged uploads before stopping the owned proxy. A requested
      # manual cache must also finish its drain successfully.
      - name: Stop Bazel remote cache
        id: bazel-remote-stop
        if: ${{ always() && steps.bazel-remote.outcome == 'success' }}
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || !inputs.r2 }}
        shell: bash
        run: |
          # Expand variables inside the Nix child, not the runner's host shell.
          # shellcheck disable=SC2016
          script/ao/pinned-nix-shell.sh ./shell.nix --run 'python3 script/ao/portal/bazel_remote_cache.py stop --state "$RUNNER_TEMP/aobus-bazel-remote" --report "$RUNNER_TEMP/bazel-r2-stop.json"'

      # Only look up tools in Nix. Bare Bazel must discover the SDK without the portal.
      - name: Test direct Bazel entry
        if: ${{ steps.bazel-check.outcome == 'success' }}
        shell: bash
        run: |
          unset AOBUS_BAZEL_CONFIGURATION AOBUS_BAZEL_PYTHON AOBUS_BAZEL_LINT_CONFIGURATION \
            AOBUS_NIX_DEPENDENCY_REPORT AO_NIX_PORTAL_PYTHON AOBUS_BAZEL_REMOTE_CACHE
          # shellcheck disable=SC2016
          tools="$(script/ao/pinned-nix-shell.sh ./shell.nix --pure --run 'set -eu; printf "%s\t%s\t%s\n" "$(command -v bazel)" "$AOBUS_BAZEL_SERVER_JAVABASE" "$(command -v python3)"')"
          IFS=$'\t' read -r bazel server_javabase python <<< "$tools"
          bare="$RUNNER_TEMP/aobus-bare"
          mkdir -p "$bare"
          PYTHONPATH=script "$python" test/lint/check_scoped_reports.py "$bare/scoped-lint.bep.json" \
            "$bazel" --nosystem_rc --nohome_rc --server_javabase="$server_javabase" \
            --output_user_root="$AOBUS_STATE_ROOT/bazel" --output_base="$bare/state/output" \
            build --jobs="$CMAKE_BUILD_PARALLEL_LEVEL" --lockfile_mode=error \
            --symlink_prefix="$bare/bazel-" --disk_cache="$AOBUS_BAZEL_DISK_CACHE" 2>&1 | tee "$bare/scoped-lint.log"

      - name: Summarize native validation
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          BAZEL_REMOTE_START: ${{ steps.bazel-remote.outcome }}
          BAZEL_REMOTE_BOUND: ${{ steps.bazel-remote.outputs.url != '' }}
          BAZEL_REMOTE_STOP: ${{ steps.bazel-remote-stop.outcome }}
        run: |
          # Expand runner paths inside the pinned Python environment.
          # shellcheck disable=SC2016
          script/ao/pinned-nix-shell.sh ./shell.nix --run 'python script/ao/portal/bazel_ci_summary.py \
            --tree "$RUNNER_TEMP/aobus-bazel-fastbuild" \
            --remote-start "$BAZEL_REMOTE_START" --remote-bound "$BAZEL_REMOTE_BOUND" \
            --remote-stop-outcome "$BAZEL_REMOTE_STOP" \
            --remote-report "$RUNNER_TEMP/bazel-r2-stop.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"'

      # Keep only AC/CAS entries newer than the post-restore marker. Missing markers
      # and failed trims block promotion, without making cache transport a gate.
      # Exact archive hits need neither trimming nor saving.
      - name: Trim restored Bazel disk cache
        id: bazel-cache-trim
        if: ${{ steps.bazel-cache-marker.outcome == 'success' && steps.bazel-cache.outcome == 'success' && steps.bazel-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          AOBUS_BAZEL_CACHE_MARKER: ${{ runner.temp }}/aobus-bazel-cache-restored.marker
        run: |
          if [[ ! -f "$AOBUS_BAZEL_CACHE_MARKER" ]]; then
            echo "::error::Bazel cache restore marker '$AOBUS_BAZEL_CACHE_MARKER' is missing; not saving." >&2
            exit 1
          fi
          if [[ ! -d "$AOBUS_BAZEL_DISK_CACHE" ]]; then
            echo 'Bazel cache directory is absent; nothing to trim.'
            exit 0
          fi
          # Bazel servers may still hold gc/lock or be publishing files from tmp/.
          for store in ac cas; do
            dir="$AOBUS_BAZEL_DISK_CACHE/$store"
            [[ -d "$dir" ]] || continue
            removed="$(find "$dir" -type f ! -newer "$AOBUS_BAZEL_CACHE_MARKER" -delete -printf . | wc -c)"
            echo "Trimmed $removed untouched $store file(s)."
          done
          du -sh "$AOBUS_BAZEL_DISK_CACHE"
          df -h "$AOBUS_BAZEL_DISK_CACHE"

      - name: Save Bazel disk cache
        if: >-
          ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
              steps.bazel-check.outcome == 'success' &&
              steps.bazel-cache.outcome == 'success' && steps.bazel-cache.outputs.cache-hit != 'true' &&
              steps.bazel-cache-trim.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.AOBUS_BAZEL_DISK_CACHE }}/ac
            ${{ env.AOBUS_BAZEL_DISK_CACHE }}/cas
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Preserve Bazel completion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-linux-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aobus-completion.log
            ${{ runner.temp }}/aobus-bazel-fastbuild/build.log
            ${{ runner.temp }}/aobus-bazel-fastbuild/checks/fastbuild/check-*
            ${{ runner.temp }}/aobus-bazel-fastbuild/lint/run-*/*.receipt.json
            ${{ runner.temp }}/aobus-bazel-fastbuild/lint/run-*/*.log
            ${{ runner.temp }}/aobus-bazel-fastbuild/lint/run-*/*.bep.json
            ${{ runner.temp }}/aobus-bazel-fastbuild/state/output/execroot/_main/bazel-out/*/testlogs/**
            ${{ runner.temp }}/aobus-bazel-fastbuild/checker-reports.bep.json
            ${{ runner.temp }}/aobus-bare/scoped-lint.bep.json
            ${{ runner.temp }}/aobus-bare/scoped-lint.log
            ${{ runner.temp }}/bazel-r2-stop.json
          if-no-files-found: warn

      - name: Show final disk usage
        if: ${{ always() }}
        run: df -h

  # Preserve the existing required status without serializing the two checks.
  linux_check:
    name: Linux / check
    needs: [changes, repository, linux]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the results for the classified scope
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          echo "scope=$SCOPE_RESULT docs-only=$DOCS_ONLY repository=$REPOSITORY_RESULT linux=$LINUX_RESULT"
          case "$SCOPE_RESULT:$DOCS_ONLY:$REPOSITORY_RESULT:$LINUX_RESULT" in
            success:true:success:skipped|success:false:success:success) exit 0 ;;
            *) exit 1 ;;
          esac

  macos:
    name: macOS ${{ matrix.label }} / check
    needs: changes
    if: ${{ needs.changes.outputs.docs-only == 'false' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Intel
            runner: macos-15-intel
            cache_arch: x64
            uname_arch: x86_64
          - label: ARM64
            runner: macos-15
            cache_arch: arm64
            uname_arch: arm64
    env:
      AOBUS_CHECKOUT_ID: github-actions-macos-${{ matrix.cache_arch }}
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use every runner core
        shell: bash
        run: >-
          python3 script/ao/core/jobs.py export-ci
          --github-env "$GITHUB_ENV"

      - name: Configure local state
        shell: bash
        run: |
          state_root="$RUNNER_TEMP/aobus-state"
          mkdir -p "$state_root"
          printf 'AOBUS_STATE_ROOT=%s\n' "$state_root" >> "$GITHUB_ENV"

      # vcpkg port builds still need CMake, Ninja and autotools; Aobus itself
      # is not configured or compiled with CMake in this workflow.
      - name: Install host toolchain
        shell: bash
        run: |
          brew install \
            llvm@22 \
            cmake \
            ninja \
            pkgconf \
            python@3.14 \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Capture macOS toolchain identity
        id: macos-toolchain
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.uname_arch }}
        run: |
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Runner architecture is $actual_arch; expected $EXPECTED_ARCH." >&2
            exit 1
          fi

          console_user="$(stat -f '%Su' /dev/console)"
          if [[ "$console_user" == "root" ]]; then
            echo 'No logged-in console user; native Core Audio validation would be incomplete.' >&2
            exit 1
          fi

          llvm_root="$(brew --prefix llvm@22)"
          python_root="$(brew --prefix python@3.14)"
          llvm_version="$("$llvm_root/bin/clang++" -dumpversion)"
          python_version="$("$python_root/bin/python3.14" -c \
            'import platform; print(platform.python_version())')"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          {
            printf 'llvm=%s\n' "$llvm_version"
            printf 'python=%s\n' "$python_version"
            printf 'sdk=%s\n' "$sdk_version"
            printf 'image=%s\n' "${ImageVersion:-unknown}"
          } >> "$GITHUB_OUTPUT"

          printf 'macOS %s, %s, console %s, LLVM %s, Python %s, SDK %s, image %s\n' \
            "$(sw_vers -productVersion)" \
            "$actual_arch" \
            "$console_user" \
            "$llvm_version" \
            "$python_version" \
            "$sdk_version" \
            "${ImageVersion:-unknown}"

      - name: Restore managed macOS tools
        id: macos-state
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/aobus-state/tools/vcpkg
            ${{ runner.temp }}/aobus-state/tools/libcxx-expected-shim
            ${{ runner.temp }}/aobus-state/tools/buildifier
            ${{ runner.temp }}/aobus-state/tools/prettier
          key: >-
            macos-state-v1-${{ runner.arch }}-${{ steps.macos-toolchain.outputs.llvm }}-${{
              hashFiles('script/ao/macos-toolchain.json', 'script/ao/buildifier.json',
                        'script/ao/prettier.json', 'script/ao/portal/prettier.py')
            }}

      - name: Resolve vcpkg binary cache key
        id: vcpkg-key
        shell: bash
        env:
          ARCH: ${{ runner.arch }}
          LLVM: ${{ steps.macos-toolchain.outputs.llvm }}
          SDK: ${{ steps.macos-toolchain.outputs.sdk }}
          IMAGE: ${{ steps.macos-toolchain.outputs.image }}
          MANIFEST: ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**') }}
        run: |
          base="vcpkg-files-v2-macos-$ARCH-$LLVM-$SDK-$MANIFEST-"
          {
            printf 'base=%s\n' "$base"
            printf 'prefix=%s\n' "$base$IMAGE-"
          } >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/aobus-state/cache/vcpkg/binaries
          key: ${{ steps.vcpkg-key.outputs.prefix }}
          restore-keys: |
            ${{ steps.vcpkg-key.outputs.base }}
            vcpkg-files-v2-macos-${{ runner.arch }}-
            vcpkg-files-v1-macos-${{ runner.arch }}-

      - name: Show initial disk usage
        run: df -h

      # Fill and seal native dependency archives before product validation so
      # later failures do not discard a cold vcpkg cache fill.
      - name: Prepare vcpkg binary cache
        id: vcpkg-prepare
        timeout-minutes: 120
        run: |
          ./ao setup bazel
          ./ao setup deps --path "$RUNNER_TEMP/aobus-bazel-fastbuild"

      - name: Seal vcpkg binary cache
        id: vcpkg-cache-ready
        if: ${{ !cancelled() && steps.vcpkg-prepare.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: >-
          python3 script/ao/portal/vcpkg_binary_cache.py seal
          --cache-dir "$AOBUS_STATE_ROOT/cache/vcpkg/binaries"
          --build-root "$RUNNER_TEMP/aobus-bazel-fastbuild"
          --key-prefix "${{ steps.vcpkg-key.outputs.prefix }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Buildifier
        id: buildifier
        shell: bash
        run: ./ao setup buildifier

      - name: Set up pinned Prettier
        id: prettier
        shell: bash
        run: ./ao setup prettier

      - name: Save managed macOS tools
        if: >-
          ${{ !cancelled() && steps.macos-state.outcome == 'success' &&
              steps.macos-state.outputs.cache-hit != 'true' &&
              steps.vcpkg-prepare.outcome == 'success' &&
              steps.buildifier.outcome == 'success' &&
              steps.prettier.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/aobus-state/tools/vcpkg
            ${{ runner.temp }}/aobus-state/tools/libcxx-expected-shim
            ${{ runner.temp }}/aobus-state/tools/buildifier
            ${{ runner.temp }}/aobus-state/tools/prettier
          key: ${{ steps.macos-state.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache
        if: >-
          ${{ !cancelled() && steps.vcpkg-cache.outcome == 'success' &&
              steps.vcpkg-cache-ready.outputs.ready == 'true' &&
              steps.vcpkg-cache-ready.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/aobus-state/cache/vcpkg/binaries
          key: ${{ steps.vcpkg-cache-ready.outputs.key }}

      # Same-repository PRs download from main's prefix without uploaders.
      # Manual validation still trusts its checkout and writes an isolated prefix.
      - name: Start Bazel remote cache
        id: bazel-remote
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.r2) ||
              (vars.AOBUS_BAZEL_R2_CACHE_AUTHORIZED == 'true' &&
               ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) }}
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || !inputs.r2 }}
        shell: bash
        env:
          R2_ENDPOINT: ${{ secrets.R2_SCCACHE_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          CACHE_PREFIX: ${{ github.event_name == 'workflow_dispatch' && format('bazel-ci-validation/{0}/{1}/macos-{2}', github.run_id, github.run_attempt, matrix.cache_arch) || 'bazel-v1' }}
          CACHE_UPLOAD: ${{ github.event_name != 'pull_request' }}
        run: >-
          "$(brew --prefix python@3.14)/bin/python3.14" script/ao/portal/bazel_remote_cache.py start
          --state "$RUNNER_TEMP/aobus-bazel-remote"
          --github-output "$GITHUB_OUTPUT"
          --runner-os "$RUNNER_OS"
          --runner-arch "$RUNNER_ARCH"
          --trusted-writer "$CACHE_UPLOAD" --key-prefix "$CACHE_PREFIX"

      - name: Require requested R2 cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.r2 }}
        env:
          CACHE_URL: ${{ steps.bazel-remote.outputs.url }}
        run: test -n "$CACHE_URL"

      # Reuse matching passing test results; diagnostics can request --fresh.
      - name: Check Bazel completion
        id: build
        shell: bash
        env:
          AOBUS_BAZEL_REMOTE_CACHE: ${{ steps.bazel-remote.outputs.url }}
          LINT_BASE_SHA: ${{ needs.changes.outputs.lint-base }}
        run: |
          lint_args=(--extend)
          if [[ -n "$LINT_BASE_SHA" ]]; then lint_args=(--lint-base "$LINT_BASE_SHA"); fi
          ./ao check --native-only --path "$RUNNER_TEMP/aobus-bazel-fastbuild" --jobs "$CMAKE_BUILD_PARALLEL_LEVEL" "${lint_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/aobus-completion.log"

      - name: Stop Bazel remote cache
        id: bazel-remote-stop
        if: ${{ always() && steps.bazel-remote.outcome == 'success' }}
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || !inputs.r2 }}
        shell: bash
        run: >-
          "$(brew --prefix python@3.14)/bin/python3.14" script/ao/portal/bazel_remote_cache.py stop --state "$RUNNER_TEMP/aobus-bazel-remote"
          --report "$RUNNER_TEMP/bazel-r2-stop.json"

      - name: Summarize native validation
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          BAZEL_REMOTE_START: ${{ steps.bazel-remote.outcome }}
          BAZEL_REMOTE_BOUND: ${{ steps.bazel-remote.outputs.url != '' }}
          BAZEL_REMOTE_STOP: ${{ steps.bazel-remote-stop.outcome }}
        run: |
          "$(brew --prefix python@3.14)/bin/python3.14" script/ao/portal/bazel_ci_summary.py \
            --tree "$RUNNER_TEMP/aobus-bazel-fastbuild" \
            --remote-start "$BAZEL_REMOTE_START" --remote-bound "$BAZEL_REMOTE_BOUND" \
            --remote-stop-outcome "$BAZEL_REMOTE_STOP" \
            --remote-report "$RUNNER_TEMP/bazel-r2-stop.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve Bazel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-macos-${{ matrix.cache_arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aobus-completion.log
            ${{ runner.temp }}/aobus-bazel-fastbuild/build.log
            ${{ runner.temp }}/aobus-bazel-fastbuild/checks/fastbuild/check-*
            ${{ runner.temp }}/aobus-bazel-fastbuild/lint/run-*/*.receipt.json
            ${{ runner.temp }}/aobus-bazel-fastbuild/lint/run-*/*.log
            ${{ runner.temp }}/aobus-bazel-fastbuild/lint/run-*/*.bep.json
            ${{ runner.temp }}/aobus-bazel-fastbuild/state/output/execroot/_main/bazel-out/*/testlogs/**
            ${{ runner.temp }}/bazel-r2-stop.json
          if-no-files-found: warn

      - name: Show final disk usage
        if: ${{ always() }}
        run: df -h

  windows:
    name: Windows / check
    needs: changes
    if: ${{ needs.changes.outputs.docs-only == 'false' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      # Keep portal-owned paths stable across GitHub's fresh Windows VMs so
      # restored tools contain the same absolute paths used when created.
      AOBUS_STATE_ROOT: C:\aobus-state
      # Bazel product and tooling outputs exceed the system drive's free space.
      # Keep build trees and the job-local Bazel action cache on D:. Restored
      # tools and vcpkg archives keep their existing paths on C:.
      AOBUS_BUILD_ROOT: D:\aobus-build
      AOBUS_BAZEL_DISK_CACHE: D:\aobus-bazel-cache
      AOBUS_CHECKOUT_ID: github-actions-windows-x64
      # vcpkg 2026 removed x-gha. Keep its ABI-addressed archives in a local
      # files backend and let actions/cache move that directory between VMs.
      VCPKG_BINARY_SOURCES: clear;files,C:/aobus-state/cache/vcpkg-binary,readwrite

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use every runner core
        shell: pwsh
        run: >-
          python script/ao/core/jobs.py export-ci
          --github-env "$env:GITHUB_ENV"

      - name: Capture Windows image version
        id: windows-image
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw 'GitHub-hosted Windows runner did not expose ImageVersion.'
          }
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      # Prefer the runner image's package ABIs before manifest-only changes;
      # retain the ordered same-image and legacy archive fallbacks.
      - name: Resolve vcpkg binary cache key
        id: vcpkg-key
        shell: bash
        env:
          ARCH: ${{ runner.arch }}
          IMAGE: ${{ steps.windows-image.outputs.version }}
          MANIFEST: ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**') }}
        run: |
          base="vcpkg-files-v3-windows-$ARCH-$IMAGE-"
          {
            printf 'base=%s\n' "$base"
            printf 'prefix=%s\n' "$base$MANIFEST-"
            printf 'legacy-prefix=%s\n' "vcpkg-files-v2-windows-$ARCH-$MANIFEST-$IMAGE-"
          } >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\aobus-state\cache\vcpkg-binary
          key: ${{ steps.vcpkg-key.outputs.prefix }}
          restore-keys: |
            ${{ steps.vcpkg-key.outputs.base }}
            ${{ steps.vcpkg-key.outputs.legacy-prefix }}
            vcpkg-files-v1-${{ runner.arch }}-${{ steps.windows-image.outputs.version }}-
            vcpkg-files-v3-windows-${{ runner.arch }}-
            vcpkg-files-v2-windows-${{ runner.arch }}-
            vcpkg-files-v1-${{ runner.arch }}-

      - name: Restore managed Windows tools
        id: windows-state
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\aobus-state\tools
            C:\aobus-state\n
            C:\aobus-state\cache\pip
            C:\aobus-state\cache\windows-app-sdk
          key: >-
            windows-state-v2-${{ runner.arch }}-${{
              hashFiles(
                'script/ao/toolchain.json',
                'script/ao/bazel-toolchain.json',
                '.bazelversion',
                'script/ao/buildifier.json',
                'script/ao/prettier.json',
                'script/ao/portal/prettier.py',
                'script/ao/windows-requirements.txt',
                'script/ao/docs-requirements.txt',
                'dependency-contract.json',
                'app/windows-winui/packages.config',
                'app/windows-winui/NuGet.Config'
              )
            }}

      - name: Restore Windows LLVM SDK
        id: windows-llvm
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\aobus-state\cache\llvm\toolchains
          key: >-
            windows-llvm-v1-${{ runner.arch }}-${{ hashFiles('script/ao/policy/windows_llvm_sdk.py', 'script/ao/windows-llvm-sdk.json') }}

      - name: Check Windows build prerequisites
        id: windows-prerequisites
        shell: pwsh
        run: .\ao.bat check winui --build-only

      - name: Test Windows completion invocation
        shell: pwsh
        env:
          PYTHONPATH: script
        run: |
          $contract = Get-Content script/ao/toolchain.json -Raw | ConvertFrom-Json
          $python = Join-Path $env:AOBUS_STATE_ROOT "tools\python\$($contract.python)\python.exe"
          & $python -S -B -X utf8 test/script/test_ci_parallelism.py GateRoutingTest.test_windows_native_completion_invocation

      - name: Set up Windows App Runtime
        id: windows-app-runtime
        shell: pwsh
        timeout-minutes: 10
        run: .\ao.bat setup winui-runtime

      - name: Show initial disk usage
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      # Provision installs dependencies before NuGet and the pinned LLVM SDK.
      # Seal even after a failed provision so an installed dependency cache fill
      # survives later SDK failure; only admitted content can be saved.
      - name: Prepare vcpkg binary cache
        id: vcpkg-prepare
        shell: pwsh
        timeout-minutes: 60
        run: |
          .\ao.bat setup bazel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ao.bat setup deps --path D:\aobus-bazel-fastbuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Seal vcpkg binary cache
        id: vcpkg-cache-ready
        if: ${{ !cancelled() && steps.vcpkg-prepare.outcome != 'skipped' }}
        continue-on-error: true
        shell: pwsh
        run: >-
          python script/ao/portal/vcpkg_binary_cache.py seal
          --cache-dir "$env:AOBUS_STATE_ROOT\cache\vcpkg-binary"
          --build-root D:\aobus-bazel-fastbuild
          --key-prefix "${{ steps.vcpkg-key.outputs.prefix }}"
          --github-output $env:GITHUB_OUTPUT

      - name: Save vcpkg binary cache
        if: >-
          ${{ !cancelled() && steps.vcpkg-cache.outcome == 'success' &&
              steps.vcpkg-cache-ready.outputs.ready == 'true' &&
              steps.vcpkg-cache-ready.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\aobus-state\cache\vcpkg-binary
          key: ${{ steps.vcpkg-cache-ready.outputs.key }}

      # Tooling needs real LLVM diagnostics; explicitly admit the existing
      # pinned SDK before tooling and expensive product completion.
      - name: Provision the pinned Windows LLVM SDK
        shell: pwsh
        run: |
          .\ao.bat setup llvm-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Buildifier
        id: buildifier
        shell: pwsh
        run: |
          .\ao.bat setup buildifier
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up pinned Prettier
        id: prettier
        shell: pwsh
        run: |
          .\ao.bat setup prettier
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # bazel-remote has no Windows build: the helper hosts the pinned Linux
      # binary in WSL2. Same-repository PRs consume main's cache without uploaders;
      # fork PRs receive no binding. Manual runs retain isolated writer prefixes.
      - name: Start Bazel remote cache
        id: bazel-remote
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.r2) ||
              (vars.AOBUS_BAZEL_R2_CACHE_AUTHORIZED == 'true' &&
               ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) }}
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || !inputs.r2 }}
        shell: pwsh
        env:
          R2_ENDPOINT: ${{ secrets.R2_SCCACHE_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
          CACHE_PREFIX: ${{ github.event_name == 'workflow_dispatch' && format('bazel-ci-validation/{0}/{1}/windows', github.run_id, github.run_attempt) || 'bazel-v1' }}
          CACHE_UPLOAD: ${{ github.event_name != 'pull_request' }}
        run: |
          $contract = Get-Content script/ao/toolchain.json -Raw | ConvertFrom-Json
          $python = Join-Path $env:AOBUS_STATE_ROOT "tools\python\$($contract.python)\python.exe"
          if (-not (Test-Path $python)) { throw "Governed Python is missing: $python" }
          & $python -I -S -B -X utf8 script/ao/portal/bazel_remote_cache.py start `
            --state "$env:RUNNER_TEMP\aobus-bazel-remote" `
            --github-output $env:GITHUB_OUTPUT `
            --runner-os $env:RUNNER_OS `
            --runner-arch $env:RUNNER_ARCH `
            --trusted-writer $env:CACHE_UPLOAD `
            --key-prefix $env:CACHE_PREFIX
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require requested R2 cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.r2 }}
        shell: bash
        env:
          CACHE_URL: ${{ steps.bazel-remote.outputs.url }}
        run: test -n "$CACHE_URL"

      # Reuse matching passing test results; diagnostics can request --fresh.
      - name: Check Bazel completion
        id: build
        shell: pwsh
        env:
          AOBUS_BAZEL_REMOTE_CACHE: ${{ steps.bazel-remote.outputs.url }}
          LINT_BASE_SHA: ${{ needs.changes.outputs.lint-base }}
          CHECK_TREE: D:\aobus-bazel-fastbuild
        run: |
          New-Item -ItemType Directory -Force $env:CHECK_TREE | Out-Null
          $lintArgs = @('--extend')
          if ($env:LINT_BASE_SHA) { $lintArgs = @('--lint-base', $env:LINT_BASE_SHA) }
          .\ao.bat check --native-only --desktop-tests --path "$env:CHECK_TREE" --jobs "$env:CMAKE_BUILD_PARALLEL_LEVEL" @lintArgs 2>&1 |
            Tee-Object -FilePath (Join-Path $env:CHECK_TREE 'completion.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native checker reports
        if: ${{ needs.changes.outputs.checker-reports == 'true' }}
        shell: pwsh
        env:
          AOBUS_BAZEL_REMOTE_CACHE: ${{ steps.bazel-remote.outputs.url }}
          PYTHONPATH: script
        run: |
          $contract = Get-Content script/ao/toolchain.json -Raw | ConvertFrom-Json
          $python = Join-Path $env:AOBUS_STATE_ROOT "tools\python\$($contract.python)\python.exe"
          & $python -S -B -X utf8 test/lint/check_checker_reports.py D:\aobus-bazel-fastbuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop Bazel remote cache
        id: bazel-remote-stop
        if: ${{ always() && steps.bazel-remote.outcome != 'skipped' }}
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || !inputs.r2 }}
        shell: pwsh
        run: |
          $contract = Get-Content script/ao/toolchain.json -Raw | ConvertFrom-Json
          $python = Join-Path $env:AOBUS_STATE_ROOT "tools\python\$($contract.python)\python.exe"
          if (-not (Test-Path $python)) { throw "Governed Python is missing: $python" }
          & $python -I -S -B -X utf8 script/ao/portal/bazel_remote_cache.py stop `
            --state "$env:RUNNER_TEMP\aobus-bazel-remote" `
            --report "$env:RUNNER_TEMP\bazel-r2-stop.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize native validation
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          BAZEL_REMOTE_START: ${{ steps.bazel-remote.outcome }}
          BAZEL_REMOTE_BOUND: ${{ steps.bazel-remote.outputs.url != '' }}
          BAZEL_REMOTE_STOP: ${{ steps.bazel-remote-stop.outcome }}
        run: |
          $contract = Get-Content script/ao/toolchain.json -Raw | ConvertFrom-Json
          $python = Join-Path $env:AOBUS_STATE_ROOT "tools\python\$($contract.python)\python.exe"
          & $python -I -S -B -X utf8 script/ao/portal/bazel_ci_summary.py `
            --tree D:\aobus-bazel-fastbuild --expect-wasapi `
            --remote-start $env:BAZEL_REMOTE_START --remote-bound $env:BAZEL_REMOTE_BOUND `
            --remote-stop-outcome $env:BAZEL_REMOTE_STOP `
            --remote-report "$env:RUNNER_TEMP\bazel-r2-stop.json" `
            --github-summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect Windows LLVM SDK
        id: windows-llvm-ready
        if: >-
          ${{ !cancelled() && steps.windows-llvm.outcome == 'success' &&
              steps.windows-llvm.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $markers = @(
            Get-ChildItem "$env:AOBUS_STATE_ROOT\cache\llvm\toolchains" `
              -Filter .aobus-llvm-sdk-complete -File -Recurse -ErrorAction SilentlyContinue
          )
          if ($markers.Count -ne 1) {
            Write-Warning "Expected one verified LLVM SDK marker; found $($markers.Count)."
            "ready=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Verified LLVM SDK marker: $($markers[0].FullName)"
            "ready=true" >> $env:GITHUB_OUTPUT
          }

      - name: Save Windows LLVM SDK
        if: >-
          ${{ !cancelled() && steps.windows-llvm.outcome == 'success' &&
              steps.windows-llvm.outputs.cache-hit != 'true' &&
              steps.windows-llvm-ready.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\aobus-state\cache\llvm\toolchains
          key: ${{ steps.windows-llvm.outputs.cache-primary-key }}

      - name: Save managed Windows tools
        if: >-
          ${{ !cancelled() && steps.windows-prerequisites.outcome == 'success' &&
              steps.windows-app-runtime.outcome == 'success' &&
              steps.vcpkg-prepare.outcome == 'success' &&
              steps.buildifier.outcome == 'success' &&
              steps.prettier.outcome == 'success' &&
              steps.windows-state.outcome == 'success' &&
              steps.windows-state.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\aobus-state\tools
            C:\aobus-state\n
            C:\aobus-state\cache\pip
            C:\aobus-state\cache\windows-app-sdk
          key: ${{ steps.windows-state.outputs.cache-primary-key }}

      - name: Preserve Bazel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-windows-${{ github.run_attempt }}
          path: |
            D:\aobus-bazel-fastbuild\completion.log
            D:\aobus-bazel-fastbuild\build.log
            D:\aobus-bazel-fastbuild\checks\fastbuild\check-*
            D:\aobus-bazel-fastbuild\lint\run-*\*.receipt.json
            D:\aobus-bazel-fastbuild\lint\run-*\*.log
            D:\aobus-bazel-fastbuild\lint\run-*\*.bep.json
            D:\aobus-bazel-fastbuild\checker-reports.bep.json
            D:\aobus-bazel-fastbuild\state\output\execroot\_main\bazel-out\*\testlogs\**
          if-no-files-found: warn

      # The receipt lives under the runner's temporary root, a different
      # drive-root child than the build trees above.
      - name: Preserve R2 stop receipt
        if: ${{ always() && steps.bazel-remote.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-windows-r2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-r2-stop.json
          if-no-files-found: warn

      - name: Show final disk usage
        if: ${{ always() }}
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
