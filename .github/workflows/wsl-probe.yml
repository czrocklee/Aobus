name: WSL bazel-remote probe

# Throwaway experiment: can the GitHub-hosted Windows runner run the Linux
# bazel-remote binary inside WSL against the real R2 bucket? Phase A produces a
# canary into an isolated run-scoped prefix, phase B consumes it from a freshly
# imported distro. This repository is public: every log line is public, so all
# output that can touch R2 values goes through Redact. Do not merge.

on:
  pull_request:
    paths:
      - .github/workflows/wsl-probe.yml

permissions:
  contents: read

concurrency:
  group: wsl-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  probe:
    name: WSL probe / windows-2025-vs2026 / ubuntu-pinned
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      DISTRO_URL: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-amd64.tar.gz
      DISTRO_SHA256: e77b6f10c2590cef872b33ee9f635a0e3fd1f57fb074c0e52b5c7f56147a0c86
      BR_URL: https://github.com/buchgr/bazel-remote/releases/download/v2.6.4/bazel-remote-2.6.4-linux-amd64
      BR_SHA256: 6a6b64666c2238ec6b49b7b29f5e41e4149de09417a0028897c9bffe40376876
      BAZELISK_URL: https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-windows-amd64.exe
      BAZELISK_SHA256: 5d14a31e9d8a363c48ba1900dbd56764d730835232eb0d113cce255856ffe3ef
      KEY_PREFIX: bazel-ci-validation/${{ github.run_id }}/${{ github.run_attempt }}/windows-wsl-probe
      CANARY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Write probe helpers
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'probe'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $lib = @'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $P = Join-Path $env:RUNNER_TEMP 'probe'
          $Distro = 'probe'
          $Results = Join-Path $P 'results.jsonl'
          $global:Redactions = @()

          # Register every R2-derived value as a mask before any other output,
          # then remember them for Redact. Messages stay generic on purpose:
          # parser exceptions can quote the input.
          function Initialize-Redaction {
            $vals = @($env:R2_ENDPOINT, $env:R2_ACCESS_KEY_ID, $env:R2_SECRET_ACCESS_KEY)
            foreach ($v in $vals) { if ($v -and $v.Length -ge 3) { Write-Host "::add-mask::$v" } }
            $hostName = ''
            try {
              $e = $env:R2_ENDPOINT.Trim()
              if ($e -notmatch '://') { $e = "https://$e" }
              $u = [uri]$e
              if ($u.Scheme -ne 'https' -or -not $u.Host -or $u.UserInfo -or $u.AbsolutePath.Trim('/') -or $u.Query -or $u.Fragment) { throw 'shape' }
              $hostName = $u.Authority
            } catch { throw 'R2 endpoint secret does not have the expected https origin shape' }
            $label = $hostName.Split('.')[0]
            $derived = @($hostName, $label, $env:R2_ENDPOINT.Trim())
            foreach ($v in $derived) { if ($v -and $v.Length -ge 3) { Write-Host "::add-mask::$v" } }
            $global:Redactions = @($vals + $derived | Where-Object { $_ -and $_.Length -ge 3 } | Sort-Object -Property Length -Descending -Unique)
          }
          function Redact {
            param([string]$Text)
            if ($null -eq $Text) { return '' }
            foreach ($v in $global:Redactions) { $Text = $Text.Replace($v, '<redacted>') }
            return $Text
          }

          # wsl.exe management commands emit UTF-16; strip NULs. Output and the
          # echoed command line are redacted; -Quiet suppresses the output echo.
          function Run-Wsl {
            param([string[]]$A, [switch]$AllowFail, [switch]$Quiet)
            $out = & wsl.exe @A 2>&1 | Out-String
            $code = $LASTEXITCODE
            $out = ($out -replace "`0", '' -replace "`r", '').Trim()
            if (-not $Quiet) {
              Write-Host (Redact "> wsl $($A -join ' ')   (exit $code)")
              if ($out) { Write-Host (Redact $out) }
            }
            if ($code -ne 0 -and -not $AllowFail) { throw (Redact "wsl exit $code : $($A -join ' ')") }
            return $out
          }
          function Dx {
            param([string]$Cmd, [switch]$AllowFail, [switch]$Quiet)
            Run-Wsl -A @('-d', $Distro, '--exec', 'sh', '-c', $Cmd) -AllowFail:$AllowFail -Quiet:$Quiet
          }
          function Invoke-Probe {
            param([string]$Id, [scriptblock]$Body)
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $status = 'PASS'; $detail = ''
            try { $detail = Redact ((& $Body | Out-String).Trim()) }
            catch { $status = 'FAIL'; $detail = 'EXCEPTION: ' + (Redact $_.Exception.Message) }
            $sw.Stop()
            $secs = [math]::Round($sw.Elapsed.TotalSeconds, 1)
            Write-Host "RESULT $Id $status ${secs}s :: $detail"
            $rec = [ordered]@{ id = $Id; status = $status; secs = $secs; detail = $detail }
            ($rec | ConvertTo-Json -Compress) | Add-Content -Path $Results -Encoding utf8
            if ($status -eq 'FAIL') { exit 1 }
          }
          function Test-Port {
            param([string]$Addr, [int]$Port, [int]$TimeoutMs = 3000)
            $c = New-Object Net.Sockets.TcpClient
            try {
              $t = $c.ConnectAsync($Addr, $Port)
              return ($t.Wait($TimeoutMs) -and $c.Connected)
            } catch { return $false } finally { $c.Dispose() }
          }
          function Wait-Proxy {
            param([int]$Seconds = 30)
            $end = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $end) {
              try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 'http://127.0.0.1:9090/status').StatusCode -eq 200) { return $true } } catch {}
              Start-Sleep -Milliseconds 500
            }
            return $false
          }

          function Import-Distro {
            $tgz = Join-Path $env:RUNNER_TEMP 'distro.tar.gz'
            if (-not (Test-Path $tgz)) { Invoke-WebRequest -UseBasicParsing -Uri $env:DISTRO_URL -OutFile $tgz }
            $h = (Get-FileHash $tgz -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $env:DISTRO_SHA256) { throw "distro sha mismatch: $h" }
            Run-Wsl -A @('--unregister', $Distro) -AllowFail -Quiet | Out-Null
            $dest = "C:\wsl\$Distro"
            Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $dest | Out-Null
            Run-Wsl -A @('--import', $Distro, $dest, $tgz, '--version', '2') | Out-Null
            $k = Run-Wsl -A @('-d', $Distro, '--exec', 'uname', '-r')
            "WSL2 import ok; kernel $k; /opt/br present: $(Dx 'test -e /opt/br && echo yes || echo no' -Quiet)"
          }
          # Windows-side download + verify, then copy into the distro filesystem.
          function Install-Binary {
            $bin = Join-Path $env:RUNNER_TEMP 'bazel-remote-linux'
            if (-not (Test-Path $bin)) { Invoke-WebRequest -UseBasicParsing -Uri $env:BR_URL -OutFile $bin }
            $h = (Get-FileHash $bin -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $env:BR_SHA256) { throw "bazel-remote sha mismatch: $h" }
            $ca = @('C:\Program Files\Git\usr\ssl\certs\ca-bundle.crt', 'C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt') | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $ca) { throw 'no Git for Windows ca-bundle.crt found' }
            $wbin = (Run-Wsl -A @('-d', $Distro, '--exec', 'wslpath', '-a', ($bin -replace '\\', '/')) -Quiet).Trim()
            $wca = (Run-Wsl -A @('-d', $Distro, '--exec', 'wslpath', '-a', ($ca -replace '\\', '/')) -Quiet).Trim()
            Dx "mkdir -p /opt/br/data && cp '$wbin' /opt/br/bazel-remote && cp '$wca' /opt/br/ca-bundle.crt && chmod +x /opt/br/bazel-remote" -Quiet | Out-Null
            Dx "echo '$env:BR_SHA256  /opt/br/bazel-remote' | sha256sum -c -" | Out-Null
            "binary verified on both sides; CA bundle $ca"
          }
          # Credentials travel only through WSLENV; the distro shell derives the
          # endpoint host, so the command text names variables, never values.
          function Start-R2Proxy {
            param([int]$Uploaders)
            Dx 'mkdir -p /opt/br/data; : > /var/log/br.log' -Quiet | Out-Null
            # Plain assignments never field-split; `export A=$B` can in dash, and
            # its error text would quote a fragment that no mask matches.
            $cmd = 'export SSL_CERT_FILE=/opt/br/ca-bundle.crt; ' +
              'h=${R2_ENDPOINT#https://}; BAZEL_REMOTE_S3_ENDPOINT=${h%%/*}; export BAZEL_REMOTE_S3_ENDPOINT; unset h; ' +
              'BAZEL_REMOTE_S3_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID; BAZEL_REMOTE_S3_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY; ' +
              'export BAZEL_REMOTE_S3_ACCESS_KEY_ID BAZEL_REMOTE_S3_SECRET_ACCESS_KEY; ' +
              'unset R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; ' +
              "setsid /opt/br/bazel-remote --dir /opt/br/data --max_size 1 --grpc_address 127.0.0.1:9092 --http_address 127.0.0.1:9090 " +
              "--s3.bucket aobus-sccache --s3.prefix $env:KEY_PREFIX --s3.auth_method access_key --s3.region auto " +
              "--num_uploaders $Uploaders --access_log_level all " +
              '> /var/log/br.log 2>&1 < /dev/null & echo $! > /run/br.pid; sleep 1'
            $env:WSLENV = 'R2_ENDPOINT:R2_ACCESS_KEY_ID:R2_SECRET_ACCESS_KEY'
            # Quiet: shell diagnostics from this one call are never echoed. The
            # values leave this process afterwards so Bazel never inherits them.
            try { Dx $cmd -Quiet | Out-Null } finally {
              $env:WSLENV = ''
              Remove-Item Env:R2_ENDPOINT, Env:R2_ACCESS_KEY_ID, Env:R2_SECRET_ACCESS_KEY -ErrorAction SilentlyContinue
            }
            if (-not (Wait-Proxy 30)) {
              Write-Host (Get-LogLines '(?i)error|fail|denied|forbidden|x509|tls|dial|lookup' 10)
              throw 'proxy did not become ready on 127.0.0.1:9090'
            }
          }
          function Read-ProxyLog {
            ((& wsl.exe -d $Distro --exec cat /var/log/br.log 2>&1) | Out-String) -replace "`0", ''
          }
          # Filtered, redacted excerpt of the raw log; the raw log is never printed.
          function Get-LogLines {
            param([string]$Pattern, [int]$Max)
            $lines = (Read-ProxyLog) -split "`r?`n" | Where-Object { $_ -match $Pattern } | Select-Object -First $Max
            Redact ($lines -join "`n")
          }
          function Get-Activity {
            param([string]$Log)
            $pe = [regex]::Escape($env:KEY_PREFIX)
            $q = @{}; $u = @{}; $fail = 0; $dl = 0; $miss = 0; $upOk = 0
            foreach ($raw in ($Log -split "`n")) {
              $line = $raw.TrimEnd("`r")
              $k = $null
              if ($line -match ' GRPC BYTESTREAM WRITE COMPLETED: (?:\S*/)?uploads/[^/]+/(?:blobs|compressed-blobs/zstd)/([0-9a-f]{64})/\d+(?:/\S*)?$') {
                $k = "CAS $($Matches[1])"; $q[$k] = 1 + [int]$q[$k]
              } elseif ($line -match ' GRPC (AC|CAS) PUT ([0-9a-f]{64}) OK$') {
                $k = "$($Matches[1]) $($Matches[2])"; $q[$k] = 1 + [int]$q[$k]
              } elseif ($line -match " S3 (UPLOAD|DOWNLOAD) aobus-sccache $pe/(ac|cas\.v2)/[0-9a-f]{2}/([0-9a-f]{64}) (.*)$") {
                $op = $Matches[1]; $kind = if ($Matches[2] -eq 'ac') { 'AC' } else { 'CAS' }; $hash = $Matches[3]; $st = $Matches[4]
                if ($op -eq 'UPLOAD') {
                  $k = "$kind $hash"; $u[$k] = 1 + [int]$u[$k]
                  if ($st -ne 'OK') { $fail++ } else { $upOk++ }
                } else {
                  if ($st -eq 'OK') { $dl++ } elseif ($st -eq 'NOT FOUND') { $miss++ }
                }
              }
            }
            $queued = 0; $completed = 0
            foreach ($key in $q.Keys) { $queued += $q[$key]; $completed += [math]::Min($q[$key], [int]$u[$key]) }
            [pscustomobject]@{ Queued = $queued; Completed = $completed; UploadOk = $upOk; Failures = $fail; Downloaded = $dl; Misses = $miss }
          }
          function Stop-Proxy {
            $p = (Dx 'cat /run/br.pid' -Quiet).Trim()
            Run-Wsl -A @('-d', $Distro, '--exec', 'kill', '-TERM', $p) | Out-Null
            $gone = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              Run-Wsl -A @('-d', $Distro, '--exec', 'kill', '-0', $p) -AllowFail -Quiet | Out-Null
              if ($LASTEXITCODE -ne 0) { $gone = $true; break }
            }
            if (-not $gone) { throw "pid $p still alive 30s after SIGTERM" }
            $closed = $false
            for ($i = 0; $i -lt 20; $i++) {
              if (-not (Test-Port '127.0.0.1' 9090 1000) -and -not (Test-Port '127.0.0.1' 9092 1000)) { $closed = $true; break }
              Start-Sleep 1
            }
            if (-not $closed) { throw 'ports 9090/9092 still open after stop' }
            "pid $p exited after SIGTERM; ports 9090/9092 closed"
          }
          function Invoke-Bazel {
            param([string]$Base)
            $b = Join-Path $env:RUNNER_TEMP 'bazelisk.exe'
            $env:USE_BAZEL_VERSION = '9.2.0'
            Push-Location (Join-Path $env:RUNNER_TEMP 'bzlws')
            try {
              $flags = @('--remote_cache=grpc://127.0.0.1:9092', '--remote_upload_local_results=true', '--remote_timeout=60s')
              $out = Redact ((& $b "--output_base=$Base" build //:g @flags 2>&1 | Out-String))
              foreach ($l in ($out -split "`r?`n")) {
                if ($l -match '^(INFO: (\d+ process|Build completed)|ERROR|FAILED|WARNING: .*(remote|cache))') { Write-Host $l }
              }
              & $b "--output_base=$Base" shutdown 2>&1 | Out-Null
              return $out
            } finally { Pop-Location }
          }
          function Assert-R2Env {
            $missing = @('R2_ENDPOINT', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY') | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
            if ($missing) { throw "R2 secret(s) empty or unavailable (fork PR?): $($missing -join ', ')" }
            Initialize-Redaction
            if ($env:KEY_PREFIX -notmatch '^bazel-ci-validation/\d+/\d+/windows-wsl-probe$') { throw 'unexpected key prefix' }
          }
          '@
          Set-Content -Path (Join-Path $dir 'lib.ps1') -Value $lib -Encoding utf8

      - name: 1 Environment facts
        id: env
        continue-on-error: true
        timeout-minutes: 3
        run: |
          . "$env:RUNNER_TEMP\probe\lib.ps1"
          Invoke-Probe '1-env' {
            $o = @()
            $o += "session id: $([Diagnostics.Process]::GetCurrentProcess().SessionId); user: $(whoami)"
            $o += "os build $((Get-CimInstance Win32_OperatingSystem).BuildNumber)"
            foreach ($a in @('--version'), @('--status')) {
              $o += "wsl $($a -join ' '): " + ((Run-Wsl -A $a -AllowFail -Quiet) -replace "`n", ' | ')
            }
            $o
          }

      - name: 2 Prepare Bazel workspace (no secrets)
        id: prep
        continue-on-error: true
        timeout-minutes: 5
        run: |
          . "$env:RUNNER_TEMP\probe\lib.ps1"
          Invoke-Probe '2-prep-bazel' {
            $b = Join-Path $env:RUNNER_TEMP 'bazelisk.exe'
            Invoke-WebRequest -UseBasicParsing -Uri $env:BAZELISK_URL -OutFile $b
            $h = (Get-FileHash $b -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $env:BAZELISK_SHA256) { throw "bazelisk sha mismatch: $h" }
            $ws = Join-Path $env:RUNNER_TEMP 'bzlws'
            New-Item -ItemType Directory -Force $ws | Out-Null
            Set-Content "$ws\MODULE.bazel" "module(name = 'probe')`n"
            # The command text embeds the run id, so the action key is unique to this run.
            Set-Content "$ws\BUILD.bazel" "genrule(name = 'g', outs = ['g.txt'], cmd_bat = 'echo canary-$env:CANARY_ID> `$@', cmd = 'echo canary-$env:CANARY_ID > `$@')`n"
            "bazelisk verified; canary id $env:CANARY_ID"
          }

      - name: A Producer phase (uploads enabled)
        id: phaseA
        continue-on-error: true
        timeout-minutes: 8
        env:
          R2_ENDPOINT: ${{ secrets.R2_SCCACHE_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
        run: |
          . "$env:RUNNER_TEMP\probe\lib.ps1"
          # Masks are registered by the first probe body, before any other output.
          Invoke-Probe 'A0-secrets' { Assert-R2Env; 'all three secrets present; endpoint shape ok; key prefix ok' }
          Invoke-Probe 'A1-import' { Import-Distro }
          Invoke-Probe 'A2-binary' { Install-Binary }
          Invoke-Probe 'A3-proxy-start' {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Start-R2Proxy -Uploaders 100
            "proxy ready $([math]::Round($sw.Elapsed.TotalSeconds, 1))s after start (R2 backend, 100 uploaders)"
          }
          Invoke-Probe 'A4-canary-build' {
            Remove-Item -Recurse -Force 'C:\ob-a' -ErrorAction SilentlyContinue
            $out = Invoke-Bazel 'C:\ob-a'
            if ($out -match 'remote cache hit') { throw 'producer build unexpectedly hit the remote cache; canary is not unique' }
            if ($out -notmatch 'Build completed successfully') { throw 'producer build did not complete' }
            'producer build completed, no remote cache hit (canary unique to this run)'
          }
          Invoke-Probe 'A5-drain' {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $act = $null
            while ($sw.Elapsed.TotalSeconds -lt 120) {
              $act = Get-Activity (Read-ProxyLog)
              if ($act.Queued -gt 0 -and $act.Completed -ge $act.Queued) { break }
              Start-Sleep -Seconds 2
            }
            $secs = [math]::Round($sw.Elapsed.TotalSeconds, 1)
            $act = Get-Activity (Read-ProxyLog)
            Write-Host (Get-LogLines ' S3 UPLOAD ' 6)
            $sum = "queued=$($act.Queued) completed=$($act.Completed) s3_upload_ok=$($act.UploadOk) s3_upload_failures=$($act.Failures) drain=${secs}s"
            if ($act.Failures -ne 0) { throw "upload failures: $sum" }
            if ($act.UploadOk -lt 1) { throw "no successful S3 uploads: $sum" }
            if ($act.Completed -lt $act.Queued) { throw "drain incomplete: $sum" }
            $sum
          }
          Invoke-Probe 'A6-stop' { Stop-Proxy }
          # The last native call (kill -0 polling) leaves a nonzero exit code; failures already exit 1.
          exit 0

      - name: B Consumer phase (fresh distro, no uploads)
        id: phaseB
        if: ${{ always() && steps.phaseA.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          R2_ENDPOINT: ${{ secrets.R2_SCCACHE_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
        run: |
          . "$env:RUNNER_TEMP\probe\lib.ps1"
          Invoke-Probe 'B0-secrets' { Assert-R2Env; 'all three secrets present; endpoint shape ok; key prefix ok' }
          Invoke-Probe 'B1-reimport' { Import-Distro }
          Invoke-Probe 'B2-binary' { Install-Binary }
          Invoke-Probe 'B3-proxy-start' {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Start-R2Proxy -Uploaders 0
            "proxy ready $([math]::Round($sw.Elapsed.TotalSeconds, 1))s after start (R2 backend, 0 uploaders)"
          }
          Invoke-Probe 'B4-consumer-build' {
            Remove-Item -Recurse -Force 'C:\ob-b' -ErrorAction SilentlyContinue
            $out = Invoke-Bazel 'C:\ob-b'
            if ($out -notmatch '[1-9]\d* remote cache hit') { throw 'consumer build had no remote cache hit' }
            ($out -split "`r?`n" | Select-String 'remote cache hit' | ForEach-Object { $_.Line.Trim() }) -join '; '
          }
          Invoke-Probe 'B5-downloads' {
            $act = Get-Activity (Read-ProxyLog)
            Write-Host (Get-LogLines ' S3 DOWNLOAD ' 6)
            $sum = "s3_download_ok=$($act.Downloaded) s3_download_not_found=$($act.Misses) s3_upload_ok=$($act.UploadOk)"
            if ($act.Downloaded -lt 1) { throw "no successful S3 downloads: $sum" }
            $sum
          }
          Invoke-Probe 'B6-stop' { Stop-Proxy }
          # The last native call (kill -0 polling) leaves a nonzero exit code; failures already exit 1.
          exit 0

      - name: Cleanup
        id: cleanup
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          . "$env:RUNNER_TEMP\probe\lib.ps1"
          Invoke-Probe 'C-cleanup' {
            Run-Wsl -A @('--terminate', $Distro) -AllowFail -Quiet | Out-Null
            Run-Wsl -A @('--unregister', $Distro) -AllowFail -Quiet | Out-Null
            $l = Run-Wsl -A @('-l', '-q') -AllowFail -Quiet
            if ($l -match "(?m)^$Distro$") { throw 'distro still registered' }
            'terminated and unregistered'
          }

      - name: Summary
        if: ${{ always() }}
        run: |
          $P = Join-Path $env:RUNNER_TEMP 'probe'
          $recs = @{}
          Get-Content (Join-Path $P 'results.jsonl') -ErrorAction SilentlyContinue | ForEach-Object {
            $r = $_ | ConvertFrom-Json; $recs[$r.id] = $r
          }
          $required = 'A0-secrets', 'A1-import', 'A2-binary', 'A3-proxy-start', 'A4-canary-build', 'A5-drain', 'A6-stop',
                      'B0-secrets', 'B1-reimport', 'B2-binary', 'B3-proxy-start', 'B4-consumer-build', 'B5-downloads', 'B6-stop'
          $all = @('1-env', '2-prep-bazel') + $required + @('C-cleanup')
          $lines = @('| Item | Result | Seconds | Detail |', '|---|---|---|---|')
          $fail = $false
          foreach ($id in $all) {
            $r = $recs[$id]
            if ($r) { $st = $r.status; $s = $r.secs; $d = ($r.detail -replace '\|', '/' -replace "\r?\n", ' ; ') }
            else { $st = 'NOT RUN'; $s = ''; $d = '' }
            if ($d.Length -gt 400) { $d = $d.Substring(0, 400) + '...' }
            if ($id -in $required -and $st -ne 'PASS') { $fail = $true }
            $lines += "| $id | $st | $s | $d |"
          }
          function St($id) { if ($recs[$id]) { $recs[$id].status } else { 'NOT RUN' } }
          function Sum($p) { [math]::Round((($recs.Keys | Where-Object { $_ -like "$p*" } | ForEach-Object { $recs[$_].secs } | Measure-Object -Sum).Sum), 1) }
          $lines += ''
          $lines += "Secrets present: $(St 'A0-secrets')"
          $lines += "Credentials reached the process via WSLENV (inferred from authenticated S3 upload OK): $(St 'A5-drain')"
          $lines += "TLS to R2 with the injected CA bundle (inferred, distro has no system CAs): $(St 'A5-drain')"
          $lines += "Upload count/failures and drain seconds: see A5-drain row"
          $lines += "Consumer remote cache hit: $(St 'B4-consumer-build'); S3 downloads: $(St 'B5-downloads')"
          $lines += "Stop and ports closed: producer $(St 'A6-stop'), consumer $(St 'B6-stop')"
          $lines += "Phase wall times: producer $(Sum 'A')s, consumer $(Sum 'B')s"
          $lines += "Overall: $(if ($fail) { 'FAIL' } else { 'PASS' })"
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($fail) { exit 1 }
