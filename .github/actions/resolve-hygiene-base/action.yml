name: Resolve hygiene base
description: Select and verify the commit used as the changed-file hygiene base

outputs:
  sha:
    description: Verified base commit expression
    value: ${{ steps.resolve.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Resolve base commit
      id: resolve
      shell: bash
      env:
        PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        if [[ -n "$PULL_REQUEST_BASE_SHA" ]]; then
          base="$PULL_REQUEST_BASE_SHA"
        elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
          base="$PUSH_BEFORE_SHA"
        else
          base="HEAD~1"
        fi

        git rev-parse --verify "$base^{commit}"
        printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
