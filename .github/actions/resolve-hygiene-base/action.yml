name: Resolve validation scope
description: Verify the hygiene base and classify documentation-only changes

outputs:
  sha:
    description: Verified base commit expression
    value: ${{ steps.resolve.outputs.sha }}
  docs-only:
    description: True only for a nonempty change containing documentation or skill Markdown
    value: ${{ steps.resolve.outputs.docs-only }}

runs:
  using: composite
  steps:
    - name: Resolve base commit
      id: resolve
      shell: bash
      env:
        PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        WORKFLOW_REF: ${{ github.ref }}
      run: bash "${{ github.action_path }}/resolve.sh"
